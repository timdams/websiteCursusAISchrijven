# Handige resources. Elke kaart: title, description (één regel), path (de url)
# en categories (labels; een klik op een label toont enkel die kaarten).
# Gegroepeerd per label, in de volgorde van de drie stappen.

# ---------- skills ----------

- title: "skills.sh"
  description: "Een openbare lijst van skills voor agents, met een ranglijst van de meest geïnstalleerde. Gemaakt door Vercel. Installeren gaat met een commando in de terminal, dus dit is voor wie met een agent werkt. Lees een skill voor je hem installeert."
  path: https://skills.sh
  categories: [skills, agent]

- title: "De skills van Anthropic"
  description: "Echte SKILL.md-bestanden om te lezen hoe zo'n recept eruitziet: Word, PowerPoint, Excel en pdf maken, en skill-creator, een skill die skills schrijft."
  path: https://github.com/anthropics/skills
  categories: [skills, agent]

- title: "Agent Skills"
  description: "Wat een skill is en hoe hij in elkaar zit, in de documentatie van Anthropic."
  path: https://docs.claude.com/en/docs/agents-and-tools/agent-skills/overview
  categories: [skills, Claude]

- title: "Skills in Claude"
  description: "Een eigen skill opladen in claude.ai: een zip met je SKILL.md, onder Customize > Skills."
  path: https://support.claude.com/en/articles/12512180-use-skills-in-claude
  categories: [skills, Claude]

- title: "excalidraw-videoclip"
  description: "Mijn skill voor kennisclips en reels in handgetekende stijl, als zip. Met een LEESMIJ die uitlegt hoe je ze naar je hand zet. Werkt met Claude in VS Code of Claude Code."
  path: ../downloads/excalidraw-videoclip.zip
  categories: [skills, agent, Claude]

