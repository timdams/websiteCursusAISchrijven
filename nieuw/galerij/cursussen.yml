# Coole cursussen. Overgenomen uit `voorbeelden` in site/data.js.
# Elke kaart: title, author (de maker), description (één regel), path (de url),
# image (een schermafdruk in beelden/, 640 op 400) en categories (de techniek
# erachter, als labels op de kaart). De volgorde hier is de volgorde op de pagina.
#
# De schermafdrukken zijn gemaakt met Edge zonder venster, op 1280 op 800, en
# verkleind. Verandert een site van uitzicht, maak de afdruk dan opnieuw.

- title: "Programmeren & OOP"
  author: "Stephane Van Rossem & Vincent Van Camp"
  description: "Een cursus C# als website, gebouwd met Docusaurus. Knap detail: er zit een AI-assistent in de pagina zelf, die studenten verder helpt terwijl ze aan de oefeningen zitten."
  path: https://vincentvcap.github.io/graduaat-csharp-programmeren/
  image: beelden/programmeren-oop.jpg
  categories: [Docusaurus, markdown, GitHub Pages, Gemini]

- title: "Zie Scherp Scherper"
  author: "Tim Dams"
  description: "Een cursus C# waarbij het handboek, de slides en de website uit dezelfde markdown-bestanden komen. Verbeter je een zin in het hoofdstuk over casting, dan staat ze in alle drie."
  path: https://timdams.github.io/ziescherpscherper/
  image: beelden/zie-scherp-scherper.jpg
  categories: [Quarto, markdown, GitHub Pages]

- title: "Webontwikkeling"
  author: "Andie Similon"
  description: "Een cursus webontwikkeling als website, opgebouwd uit markdown-bestanden met Docusaurus. Onder elke pagina staat een link om ze te verbeteren, en na het opslaan staat de nieuwe versie vanzelf online."
  path: https://webontwikkeling.cloud-ap.be/
  image: beelden/webontwikkeling.jpg
  categories: [Docusaurus, markdown, Vercel]

- title: "IT Essentials"
  author: "Jannes Peeters"
  description: "Een cursus waar de studenten in de pagina zelf werken: een terminal en een editor die in de browser draaien, quizjes tussendoor, en een stappenplan dat pas verder gaat als het vorige stuk af is."
  path: https://it-essentials.apload.be/
  image: beelden/it-essentials.jpg
  categories: [Docusaurus, Marp, markdown]

- title: "Slides naar sjabloon"
  author: "Ward De Ridder"
