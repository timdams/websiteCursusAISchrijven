# Zet de site uit nieuw/ op GitHub Pages. Quarto rendert ze naar nieuw/_site, en
# de live slides uit slides/ komen daar als slides/index.html bij, zodat /slides/
# blijft werken voor wie de link of de QR-code van de talk heeft. Niets daarvan
# staat in git; deze stappen maken het. De oude site in site/ gaat niet meer
# online.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk. Een lopende deploy niet afbreken, anders staat de site
# halverwege stil.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Dezelfde versie als lokaal, zodat online hetzelfde verschijnt als in
      # quarto preview.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.35

      # In geen enkele qmd staat code die uitgevoerd moet worden, dus R noch
      # Python hoeft erbij.
      - name: Site renderen
        working-directory: nieuw
        run: quarto render

      # Na de site, anders veegt die render de map slides/ weer weg. Het
      # resultaat heet index.html, zodat de map zelf het adres is: /slides/ en
      # niet /slides/cursus-schrijven-met-ai.html.
      - name: Slides renderen
        working-directory: slides
        run: quarto render cursus-schrijven-met-ai.qmd --output index.html --output-dir ../nieuw/_site/slides

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nieuw/_site
      - id: deployment
        uses: actions/deploy-pages@v4
